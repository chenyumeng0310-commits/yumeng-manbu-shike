<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7fb" />
    <meta name="description" content="Yumeng · 漫步时刻——手机优先的个人任务与目标工作台" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260903" />
    <title>Yumeng · 漫步时刻</title>
  </head>
  <body>
    <main class="app-shell" id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="header-date"></p>
          <h1 id="page-title">Yumeng，一步步来，会越来越棒！</h1>
          <p class="subtitle" id="page-subtitle">慢慢来，今天也会很顺利。</p>
        </div>
        <button class="icon-button" id="settings-button" type="button" aria-label="打开设置">⚙️</button>
      </header>

      <section class="page active" id="today-page" data-page="today"></section>
      <section class="page" id="calendar-page" data-page="calendar"></section>
      <section class="page" id="reminders-page" data-page="reminders"></section>
      <section class="page" id="goals-page" data-page="goals"></section>
      <section class="page" id="history-page" data-page="history"></section>

      <button class="floating-add" id="add-button" type="button" aria-label="新增任务">＋</button>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" type="button" data-target="today"><span>⌂</span>今天</button>
        <button class="nav-item" type="button" data-target="calendar"><span>□</span>日历</button>
        <button class="nav-item" type="button" data-target="reminders"><span>◷</span>提醒</button>
        <button class="nav-item" type="button" data-target="goals"><span>✦</span>目标</button>
      </nav>
    </main>

    <dialog class="modal" id="task-dialog">
      <form class="modal-sheet" id="task-form" method="dialog">
        <div class="modal-heading"><h2>新增任务</h2><button class="plain-close" data-close-dialog="task-dialog" type="button" aria-label="关闭">×</button></div>
        <label>任务名称<input name="title" placeholder="例如：准备课堂练习" required maxlength="80" /></label>
        <div class="form-grid">
          <label>日期<input name="date" type="date" required /></label>
          <label>截止时间<input name="time" type="time" required /></label>
        </div>
        <div class="form-grid">
          <label>紧急程度<select name="priority"><option value="urgent">紧急</option><option value="normal" selected>普通</option><option value="relaxed">不急</option></select></label>
          <label>预计分钟<input name="duration" type="number" min="5" max="1440" value="30" required /></label>
        </div>
        <label>Emoji 图标<select name="emoji"><option value="📚">📚 课程 / 学习</option><option value="🖥️">🖥️ 工作</option><option value="📖">📖 阅读</option><option value="🌿">🌿 运动 / 生活</option><option value="✉️">✉️ 沟通</option><option value="✨">✨ 其他</option></select></label>
        <fieldset id="goal-picker"><legend>关联目标（可多选）</legend></fieldset>
        <button class="primary-button" type="submit" value="default">保存任务</button>
      </form>
    </dialog>

    <dialog class="modal" id="goal-dialog">
      <form class="modal-sheet" id="goal-form" method="dialog">
        <div class="modal-heading"><h2>新增目标</h2><button class="plain-close" data-close-dialog="goal-dialog" type="button" aria-label="关闭">×</button></div>
        <label>目标名称<input name="name" placeholder="例如：完成秋季课程设计" required maxlength="60" /></label>
        <label>Emoji 图标<select name="emoji"><option value="✦">✦ 项目</option><option value="📚">📚 学习</option><option value="📖">📖 阅读</option><option value="🌿">🌿 健康</option><option value="💡">💡 创作</option></select></label>
        <label>目标截止日<input name="dueDate" type="date" required /></label>
        <label>第一步<input name="firstStep" placeholder="例如：列出本周的三个行动" required maxlength="80" /></label>
        <button class="primary-button" type="submit" value="default">创建目标</button>
      </form>
    </dialog>

    <dialog class="modal" id="step-dialog">
      <form class="modal-sheet" id="step-form" method="dialog">
        <div class="modal-heading"><h2>添加目标步骤</h2><button class="plain-close" data-close-dialog="step-dialog" type="button" aria-label="关闭">×</button></div>
        <label>这一步要做什么？<input name="name" placeholder="例如：完成日历页面的设计" required maxlength="80" /></label>
        <div class="form-grid">
          <label>日期<input name="date" type="date" required /></label>
          <label>截止时间<input name="time" type="time" required /></label>
        </div>
        <div class="form-grid">
          <label>紧急程度<select name="priority"><option value="urgent">紧急</option><option value="normal" selected>普通</option><option value="relaxed">不急</option></select></label>
          <label>预计分钟<input name="duration" type="number" min="5" max="1440" value="30" required /></label>
        </div>
        <button class="primary-button" type="submit" value="default">添加步骤</button>
      </form>
    </dialog>

    <dialog class="modal" id="settings-dialog">
      <form class="modal-sheet" id="settings-form" method="dialog">
        <div class="modal-heading"><h2>提醒设置</h2><button class="plain-close" data-close-dialog="settings-dialog" type="button" aria-label="关闭">×</button></div>
        <p class="notice">通知需在手机浏览器中授权。第一版会在工作台打开时检查提醒。</p>
        <button class="secondary-button" id="permission-button" type="button">开启系统通知</button>
        <label>每日早晨提醒<input name="morningTime" type="time" value="08:00" /></label>
        <label>逾期重复提醒<select name="overdueInterval"><option value="15">每 15 分钟</option><option value="30" selected>每 30 分钟</option><option value="60">每 60 分钟</option></select></label>
        <button class="primary-button" type="submit" value="default">保存设置</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=20260903" defer></script>
  </body>
</html>
